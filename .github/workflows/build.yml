name: Build and Release Apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Linux Build (Ubuntu x86_64) - 本番展示環境 (Mac mini)
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux (Ubuntu 22.04 x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            server/go.sum
            client/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build Server App (Linux)
        run: |
          cd server
          npm --prefix frontend install
          npm --prefix frontend run build
          wails build -platform linux/amd64

      - name: Build Client App (Linux)
        run: |
          cd client
          npm --prefix frontend install
          npm --prefix frontend run build
          wails build -platform linux/amd64

      - name: Package Linux Artifacts
        run: |
          mkdir -p release-pkg/server release-pkg/client
          
          # Server package (バイナリ + 配信用フォルダ)
          chmod +x server/build/bin/wails-applauncher-server
          cp server/build/bin/wails-applauncher-server release-pkg/server/
          cp -r server/server-files release-pkg/server/
          tar -czvf wails-server-linux-amd64.tar.gz -C release-pkg/server .

          # Client package (バイナリ)
          chmod +x client/build/bin/wails-applauncher-client
          cp client/build/bin/wails-applauncher-client release-pkg/client/
          tar -czvf wails-client-linux-amd64.tar.gz -C release-pkg/client .

      - name: Upload Linux Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wails-server-linux-amd64
          path: wails-server-linux-amd64.tar.gz

      - name: Upload Linux Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wails-client-linux-amd64
          path: wails-client-linux-amd64.tar.gz

  # -------------------------------------------------------------
  # Job 2: macOS Build (darwin arm64) - 開発・テスト機用
  # -------------------------------------------------------------
  build-macos:
    name: Build macOS (darwin arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: |
            server/go.sum
            client/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build Server App (macOS)
        run: |
          cd server
          npm --prefix frontend install
          npm --prefix frontend run build
          wails build -platform darwin/arm64

      - name: Build Client App (macOS)
        run: |
          cd client
          npm --prefix frontend install
          npm --prefix frontend run build
          wails build -platform darwin/arm64

      - name: Package macOS Artifacts
        run: |
          mkdir -p release-pkg/server release-pkg/client

          # Server package
          cp -r server/build/bin/wails-applauncher-server.app release-pkg/server/
          cp -r server/server-files release-pkg/server/
          cd release-pkg/server && zip -r ../../wails-server-darwin-arm64.zip . && cd ../..

          # Client package
          cp -r client/build/bin/wails-applauncher-client.app release-pkg/client/
          cd release-pkg/client && zip -r ../../wails-client-darwin-arm64.zip . && cd ../..

      - name: Upload macOS Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wails-server-darwin-arm64
          path: wails-server-darwin-arm64.zip

      - name: Upload macOS Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wails-client-darwin-arm64
          path: wails-client-darwin-arm64.zip

  # -------------------------------------------------------------
  # Job 3: Publish to GitHub Releases (タグ打ち時のみ: v*)
  # -------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Flatten release files
        run: |
          mkdir -p release-assets
          find all-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## リリース成果物 (${{ github.ref_name }})

            ### 本番環境向け (Mac mini - Ubuntu x86_64)
            - **サーバー管理アプリ**: `wails-server-linux-amd64.tar.gz` (バイナリ + server-files 同梱)
            - **展示端末ランチャー**: `wails-client-linux-amd64.tar.gz`

            ### 開発・検証環境向け (macOS Apple Silicon)
            - **サーバー管理アプリ**: `wails-server-darwin-arm64.zip`
            - **展示端末ランチャー**: `wails-client-darwin-arm64.zip`
          files: release-assets/*
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
